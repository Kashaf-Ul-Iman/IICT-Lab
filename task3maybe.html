<html>
<head>
<title>Hotel Reservation</title>
<style>
body { font-family: "Times New Roman"; }
.box {
    background: lightgrey;
    width: 420px;
    padding: 10px;
    margin: auto;
}
h3 { color: red; text-align: center; }
table { background: powderblue; border: 3px ridge gray; width: 100%; }
th, td { border: 1px solid gray; padding: 3px; }
th { text-align: right; }
</style>
</head>
<body>
<div class="box">
<h3>Continental Hotel Reservation Form</h3>
<form>
<table>
<tr><th>Name</th><td><input placeholder="Enter your name"></td></tr>
<tr><th>eMail</th><td><input type="email" value="info@continental.pk"></td></tr>
<tr><th>Mobile No</th><td><input placeholder="Enter your cell number"></td></tr>
<tr><th>Arrival Time</th><td><input placeholder="Enter your arrival time"></td></tr>
<tr><th>Departure</th><td><input type="text"> <input type="text"></td></tr>
<tr><th>Room Type</th><td>
<input type="radio" name="r">Single
<input type="radio" name="r">Double<br>
<input type="radio" name="r">Presidential Suite
</td></tr>
<tr><th>Preferences</th><td>
<input type="checkbox">Non-Smoking<br>
<input type="checkbox">Internet<br>
<input type="checkbox">Firm Mattress
</td></tr>
<tr><th>Mode of Payment</th><td>
<input type="checkbox">Cash
<input type="checkbox">Check<br>
<input type="checkbox">Credit Card
<select><option>Select Card</option>
<option>Visa</option><option>MasterCard</option></select>
</td></tr>
<tr><td colspan="2" align="center">
<input type="submit" value="Send Data">
</td></tr>
</table>
</form>
</div>
</body>
</html>
